<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小說翻譯器 v1</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#1a1a1e;--surface:#242428;--surface2:#2e2e33;--border:#3a3a40;
    --text:#e8e8e2;--muted:#888882;--accent:#5b8cff;--accent-hover:#7aa3ff;
    --success:#4caf7d;--danger:#e05c5c;--radius:8px;
  }
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* ── top bar ── */
  #topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
  #app-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
  #prog-wrap{flex:1;height:6px;background:var(--bg);border-radius:999px;overflow:hidden}
  #prog-bar{height:100%;width:0%;background:var(--accent);border-radius:999px;transition:width .3s ease}
  #prog-label{font-size:12px;color:var(--muted);white-space:nowrap;min-width:80px;text-align:right}
  #gear-btn{width:30px;height:30px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:16px;transition:background .15s,color .15s;flex-shrink:0}
  #gear-btn:hover{background:var(--surface2);color:var(--text)}
  #gear-btn svg{pointer-events:none}

  /* ── main panes ── */
  #main{display:flex;flex:1;overflow:hidden}
  .pane{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .pane+.pane{border-left:1px solid var(--border)}
  .pane-header{display:flex;align-items:center;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:6px}
  .pane-title{font-size:12px;color:var(--muted);flex:1;font-weight:500;letter-spacing:.03em}
  .pane-btn{padding:3px 9px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;transition:background .15s,color .15s}
  .pane-btn:hover{background:var(--surface2);color:var(--text)}
  #inputArea{flex:1;width:100%;border:none;outline:none;resize:none;padding:14px;font-size:13px;line-height:1.8;background:var(--bg);color:var(--text);font-family:inherit}
  #outputArea{flex:1;overflow-y:auto;padding:14px;font-size:13px;line-height:2;background:var(--bg)}
  #outputArea p{margin-bottom:.8em;color:var(--text)}
  #outputArea .cursor{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:middle;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  #outputArea .placeholder{color:var(--muted);font-style:italic}

  /* ── bottom bar ── */
  #bottombar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
  #status-text{font-size:12px;color:var(--muted);flex:1}
  .btn-stop{padding:6px 14px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;transition:background .15s}
  .btn-stop:hover{background:var(--surface2);color:var(--text)}
  .btn-go{padding:6px 18px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
  .btn-go:hover{background:var(--accent-hover)}
  .btn-go:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}

  /* ── settings overlay ── */
  #settings-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:100}
  #settings-overlay.open{display:flex}
  #settings-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;width:340px;display:flex;flex-direction:column;gap:16px}
  #settings-card h2{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .close-btn{width:26px;height:26px;border-radius:var(--radius);border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
  .close-btn:hover{background:var(--surface2);color:var(--text)}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--muted)}
  .field input,.field select{width:100%;padding:7px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1}
  .save-btn{padding:8px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;width:100%;transition:background .15s}
  .save-btn:hover{background:var(--accent-hover)}
  .hint{font-size:11px;color:var(--muted);line-height:1.5}

  /* scrollbar */
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span id="app-title">小說翻譯器</span>
  <div id="prog-wrap"><div id="prog-bar"></div></div>
  <span id="prog-label">尚未開始</span>
  <button id="gear-btn" onclick="toggleSettings()" aria-label="設定">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</div>

<!-- MAIN -->
<div id="main">
  <div class="pane">
    <div class="pane-header">
      <span class="pane-title">原文（日文）</span>
      <button class="pane-btn" onclick="loadFile()">載入 .txt</button>
      <button class="pane-btn" onclick="clearInput()">清空</button>
    </div>
    <textarea id="inputArea" placeholder="請貼上日文原文，或點擊「載入 .txt」讀取檔案…"></textarea>
  </div>

  <div class="pane">
    <div class="pane-header">
      <span class="pane-title">譯文（繁體中文）</span>
      <button class="pane-btn" onclick="copyOutput()">複製全部</button>
      <button class="pane-btn" onclick="saveOutput()">儲存 .txt</button>
    </div>
    <div id="outputArea"><p class="placeholder">翻譯結果將顯示在這裡…</p></div>
  </div>
</div>

<!-- BOTTOM BAR -->
<div id="bottombar">
  <span id="status-text">就緒・請貼上原文後點擊開始翻譯</span>
  <button class="btn-stop" id="stopBtn" onclick="stopTranslation()" disabled>停止</button>
  <button class="btn-go" id="startBtn" onclick="startTranslation()">開始翻譯</button>
</div>

<!-- SETTINGS OVERLAY -->
<div id="settings-overlay">
  <div id="settings-card">
    <h2>設定 <button class="close-btn" onclick="toggleSettings()">✕</button></h2>

    <div class="field">
      <label>LM Studio API 網址</label>
      <input type="text" id="cfg-api" value="http://localhost:1234/v1">
      <span class="hint">預設為 LM Studio 本地位址；若使用其他服務請修改</span>
    </div>

    <div class="field">
      <label>模型名稱（Model ID）</label>
      <input type="text" id="cfg-model" value="gemma-3-27b-it">
      <span class="hint">需與 LM Studio 載入的模型名稱完全一致</span>
    </div>

    <div class="field-row">
      <div class="field">
        <label>每段最大字數</label>
        <input type="number" id="cfg-chunksize" value="600" min="100" max="3000" step="100">
      </div>
      <div class="field">
        <label>段落延遲（秒）</label>
        <input type="number" id="cfg-delay" value="1" min="0" max="30" step="0.5">
      </div>
    </div>

    <div class="field">
      <label>翻譯風格</label>
      <select id="cfg-style">
        <option value="natural">意譯（自然流暢，優先可讀性）</option>
        <option value="literal">直譯（忠實原文，保留語序）</option>
        <option value="novel">小說風（強化語感與節奏）</option>
      </select>
    </div>

    <button class="save-btn" onclick="saveSettings()">儲存並關閉</button>
  </div>
</div>

<!-- HIDDEN FILE INPUT -->
<input type="file" id="fileInput" accept=".txt" style="display:none" onchange="onFileLoaded(event)">

<script>
// ── Config ──────────────────────────────────────────────────────────
let cfg = {
  api: 'http://localhost:1234/v1',
  model: 'gemma-3-27b-it',
  chunkSize: 600,
  delay: 1,
  style: 'natural'
};

const STYLE_PROMPTS = {
  natural: '請將以下日文小說翻譯成繁體中文。翻譯應自然流暢，優先保持可讀性，可適當調整語序讓中文讀來自然，但意思需忠實原文。',
  literal: '請將以下日文小說翻譯成繁體中文。請直譯，盡量保留原文語序與句式結構，忠實反映原文措辭。',
  novel:   '請將以下日文小說翻譯成繁體中文。翻譯時請強化文學語感與節奏，注意對白的語氣與情緒，讓中文版本具有小說的閱讀質感。'
};

// ── State ────────────────────────────────────────────────────────────
let isRunning = false;
let shouldStop = false;
let outputParagraphs = [];

// ── Settings ─────────────────────────────────────────────────────────
function toggleSettings() {
  const o = document.getElementById('settings-overlay');
  if (!o.classList.contains('open')) {
    document.getElementById('cfg-api').value = cfg.api;
    document.getElementById('cfg-model').value = cfg.model;
    document.getElementById('cfg-chunksize').value = cfg.chunkSize;
    document.getElementById('cfg-delay').value = cfg.delay;
    document.getElementById('cfg-style').value = cfg.style;
  }
  o.classList.toggle('open');
}

function saveSettings() {
  cfg.api       = document.getElementById('cfg-api').value.trim().replace(/\/$/, '');
  cfg.model     = document.getElementById('cfg-model').value.trim();
  cfg.chunkSize = parseInt(document.getElementById('cfg-chunksize').value) || 600;
  cfg.delay     = parseFloat(document.getElementById('cfg-delay').value) || 0;
  cfg.style     = document.getElementById('cfg-style').value;
  toggleSettings();
  setStatus(`設定已儲存・${styleLabel()}・每段 ${cfg.chunkSize} 字`);
}

function styleLabel() {
  return {natural:'意譯', literal:'直譯', novel:'小說風'}[cfg.style] || '';
}

// ── File I/O ──────────────────────────────────────────────────────────
function loadFile() { document.getElementById('fileInput').click(); }

function onFileLoaded(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('inputArea').value = ev.target.result;
    setStatus(`已載入：${file.name}（${ev.target.result.length.toLocaleString()} 字）`);
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

function clearInput() {
  document.getElementById('inputArea').value = '';
  setStatus('已清空原文');
}

function copyOutput() {
  const text = outputParagraphs.join('\n\n');
  if (!text) { setStatus('目前沒有譯文可複製'); return; }
  navigator.clipboard.writeText(text).then(() => setStatus('已複製全部譯文到剪貼簿'));
}

function saveOutput() {
  const text = outputParagraphs.join('\n\n');
  if (!text) { setStatus('目前沒有譯文可儲存'); return; }
  const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'translated.txt';
  a.click();
  setStatus('已下載 translated.txt');
}

// ── Chunking ──────────────────────────────────────────────────────────
function splitIntoChunks(text, maxLen) {
  // Split on Japanese sentence-ending punctuation, keeping delimiter
  const sentences = text.match(/[^。！？\n]+[。！？\n]?/g) || [text];
  const chunks = [];
  let current = '';
  for (const s of sentences) {
    if (current.length + s.length > maxLen && current.length > 0) {
      chunks.push(current.trim());
      current = s;
    } else {
      current += s;
    }
  }
  if (current.trim()) chunks.push(current.trim());
  return chunks;
}

// ── Translation ───────────────────────────────────────────────────────
async function translateChunk(text, chunkIndex, total) {
  const systemPrompt = STYLE_PROMPTS[cfg.style];
  const response = await fetch(`${cfg.api}/chat/completions`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: cfg.model,
      stream: true,
      temperature: 0.4,
      messages: [
        {role: 'system', content: systemPrompt},
        {role: 'user', content: `請翻譯以下段落（${chunkIndex+1}/${total}）：\n\n${text}\n\n翻譯（繁體中文）：`}
      ]
    })
  });

  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API 錯誤 ${response.status}: ${err}`);
  }

  // Stream the response
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let result = '';
  let pEl = document.getElementById(`chunk-${chunkIndex}`);

  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    const lines = decoder.decode(value).split('\n');
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') break;
      try {
        const json = JSON.parse(data);
        const delta = json.choices?.[0]?.delta?.content || '';
        if (delta) {
          result += delta;
          if (pEl) pEl.textContent = result;
        }
      } catch {}
    }
    if (shouldStop) break;
  }

  return result.trim();
}

async function startTranslation() {
  const input = document.getElementById('inputArea').value.trim();
  if (!input) { setStatus('請先輸入或載入原文'); return; }

  // Reset state
  isRunning = true;
  shouldStop = false;
  outputParagraphs = [];
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;

  const chunks = splitIntoChunks(input, cfg.chunkSize);
  const total = chunks.length;

  // Clear output
  const outputArea = document.getElementById('outputArea');
  outputArea.innerHTML = '';

  setProgress(0, total);
  setStatus(`開始翻譯・共 ${total} 段・${styleLabel()}模式`);

  for (let i = 0; i < total; i++) {
    if (shouldStop) break;

    setStatus(`翻譯中 ${i+1} / ${total} 段…`);
    setProgress(i, total);

    // Create placeholder paragraph
    const p = document.createElement('p');
    p.id = `chunk-${i}`;
    p.textContent = '▍';
    outputArea.appendChild(p);
    outputArea.scrollTop = outputArea.scrollHeight;

    try {
      const translated = await translateChunk(chunks[i], i, total);
      p.textContent = translated;
      p.id = '';
      outputParagraphs[i] = translated;
    } catch (err) {
      p.style.color = 'var(--danger)';
      p.textContent = `[第 ${i+1} 段翻譯失敗：${err.message}]`;
      outputParagraphs[i] = '';
      setStatus(`第 ${i+1} 段失敗，繼續下一段…`);
    }

    // Delay between chunks
    if (!shouldStop && i < total - 1 && cfg.delay > 0) {
      await sleep(cfg.delay * 1000);
    }
  }

  isRunning = false;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;

  if (shouldStop) {
    setProgress(null, null);
    setStatus(`已停止・完成 ${outputParagraphs.filter(Boolean).length} / ${total} 段`);
  } else {
    setProgress(total, total);
    setStatus(`翻譯完成！共 ${total} 段・可點擊「複製全部」或「儲存 .txt」`);
  }
}

function stopTranslation() {
  shouldStop = true;
  setStatus('正在停止…');
  document.getElementById('stopBtn').disabled = true;
}

// ── Utilities ─────────────────────────────────────────────────────────
function setProgress(done, total) {
  const bar = document.getElementById('prog-bar');
  const label = document.getElementById('prog-label');
  if (done === null) {
    bar.style.width = '0%';
    label.textContent = '已停止';
    return;
  }
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  bar.style.width = pct + '%';
  label.textContent = total > 0 ? `${done} / ${total} 段` : '就緒';
}

function setStatus(msg) {
  document.getElementById('status-text').textContent = msg;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
</script>
</body>
</html>
